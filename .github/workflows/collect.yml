name: Collect & Deploy

# 为什么这样写：
#   1) GitHub 对免费仓库的 schedule cron 限流很重（实测 21 小时只跑了 2 次），
#      所以改成「触发一次 → 在同一个 job 里连续循环 5.5 小时」，cron 只负责接上下一个循环。
#   2) 发布不走 gh-pages 分支构建：那样有「每小时 10 次构建」的硬配额，
#      每几分钟一推就会配额用完、Page build failed，线上数据冻住。
#      改由 deploy.yml 用 Actions 部署（官方文档明确该配额不适用于 Actions 工作流）。

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data.db", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Loop: collect → commit data.db (deploy 由 deploy.yml 负责)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          git config user.name  "steam-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          export REPO_URL="https://github.com/$REPO"
          DEADLINE=$(( $(date +%s) + 19800 ))   # 5.5 小时后停止，给 job 留余量

          round=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            round=$((round + 1))
            echo "::group::round $round  $(date -u +%H:%M:%S UTC)"
            # 每轮只抓「直方图 + 商店页 summary」，总共约 2 秒，保证快照密度是分钟级
            python collect.py hist    || echo "hist failed"
            python collect.py summary || echo "summary failed"
            # 逐条评测翻页较慢（约 75 秒），每 4 轮抓一次就足够
            if [ $((round % 4)) -eq 1 ]; then
              python collect.py reviews || echo "reviews failed"
            fi
            python export.py site  || echo "export failed, continuing"
            python -c "import sqlite3;c=sqlite3.connect('data.db');print(' DB: snapshots',c.execute('select count(*) from snapshot').fetchone()[0],'reviews',c.execute('select count(*) from review').fetchone()[0])"

            git add data.db
            pushed=0
            if ! git diff --staged --quiet; then
              git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
              for i in 1 2 3; do
                if git pull --rebase --autostash -q origin main && git push -q; then
                  pushed=1; break
                fi
                sleep 3
              done
            fi

            # 由 GITHUB_TOKEN 推送不会触发别的 workflow，所以这里显式发起部署
            if [ "$pushed" = "1" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/actions/workflows/deploy.yml/dispatches" \
                -d '{"ref":"main"}')
              echo "deploy dispatch -> HTTP $code"
            fi

            echo "::endgroup::"
            sleep 230
          done
          echo "loop finished after $round rounds"
