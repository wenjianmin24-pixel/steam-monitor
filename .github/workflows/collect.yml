name: Collect & Deploy

# GitHub 对免费仓库的 schedule cron 限流严重（实测 21 小时只跑了 2 次），
# 所以这里改成「触发一次后长时间循环」：
#   每轮 抓取 → 导出 → 推 gh-pages，然后 sleep 3 分钟。
# 单次 job 覆盖约 5 小时，配合每 6 小时的 cron 补充，更新延迟约 3–4 分钟。

on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data.db"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Loop: collect → export → publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          git config user.name  "steam-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          export REPO_URL="https://github.com/$REPO"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          publish() {
            local d; d="$(mktemp -d)"
            cp -a site/. "$d"/
            ( cd "$d" && git init -q \
              && git config user.name  "steam-monitor-bot" \
              && git config user.email "bot@users.noreply.github.com" \
              && git checkout -q -b gh-pages \
              && git add -A \
              && { git commit -q -m "site: $(date -u +'%Y-%m-%d %H:%M UTC')" || true; } \
              && { for i in 1 2 3; do git push -f -q "$REMOTE" gh-pages && exit 0; sleep 4; done; exit 1; } )
            local rc=$?
            rm -rf "$d"
            return $rc
          }

          for round in $(seq 1 60); do
            echo "::group::round $round  $(date -u +%H:%M:%S UTC)"
            python collect.py all || echo "collect failed, continuing"
            python export.py site  || echo "export failed, continuing"
            python -c "import sqlite3;c=sqlite3.connect('data.db');print(' DB: snapshots',c.execute('select count(*) from snapshot').fetchone()[0],'reviews',c.execute('select count(*) from review').fetchone()[0])"

            git add data.db
            if ! git diff --staged --quiet; then
              git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
              for i in 1 2 3; do
                git pull --rebase --autostash -q origin main && git push -q && break
                sleep 4
              done
            fi

            publish && echo "published to gh-pages" || echo "publish failed"
            echo "::endgroup::"
            sleep 180
          done
