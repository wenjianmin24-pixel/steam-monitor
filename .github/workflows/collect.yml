name: Collect & Deploy

on:
  schedule:
    # 每 30 分钟抓一次（UTC）。GitHub 的定时任务可能延迟几分钟到十几分钟。
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data.db"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Steam data
        run: python collect.py all

      - name: Show data counts
        run: python -c "import sqlite3;c=sqlite3.connect('data.db');print('snapshots',c.execute('select count(*) from snapshot').fetchone()[0]);print('reviews  ',c.execute('select count(*) from review').fetchone()[0])"

      - name: Export static site
        run: |
          export REPO_URL="https://github.com/${{ github.repository }}"
          python export.py site

      - name: Commit updated data
        run: |
          git config user.name  "steam-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.db
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 定时任务与手动触发可能同时跑，push 前先 rebase 避免非快进被拒
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "could not push data.db; site is still deployed"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
